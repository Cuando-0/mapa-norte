<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizador de Mapa por Comando</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 22px;
        }
        p.sub {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* --- DISEÑO DE LAS PESTAÑAS (TABS) --- */
        .tabs-contenedor {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 25px;
        }
        .tab-boton {
            flex: 1;
            padding: 10px 5px;
            background: none;
            border: none;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            text-align: center;
        }
        .tab-boton.active {
            background-color: white;
            color: #2c3e50;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* CONFIGURACIÓN DE CONTENIDO SÓLO VISIBLE ACTIVO */
        .tab-contenido {
            display: none;
        }
        .tab-contenido.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
            text-transform: uppercase;
        }
        input[type="text"].no-caps {
            text-transform: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        .operador-input {
            border: 2px solid #34495e;
            margin-bottom: 20px;
        }
        
        /* SECCIÓN GLOBAL DEL MAPA DE BOTONES INTERACTIVOS */
        .guia-contenedor {
            margin-top: 10px;
            border-top: 2px dashed #bdc3c7;
            padding-top: 20px;
        }
        .guia-titulo {
            font-size: 14px;
            color: #34495e;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .mapa-botones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 340px;
            margin: 0 auto 10px auto;
        }
        .celda-vacia {
            background-color: transparent;
        }
        .btn-direccion {
            background-color: #34495e;
            color: white;
            border: 1px solid #2c3e50;
            border-radius: 6px;
            padding: 15px 2px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-transform: uppercase;
        }
        .btn-direccion:hover {
            background-color: #2c3e50;
        }
        .btn-direccion:active {
            transform: scale(0.95);
        }
        .celda-referencia {
            background-color: #f1c40f;
            border: 1px solid #d4ac0d;
            border-radius: 6px;
            padding: 15px 2px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Botón gigante para procesar Salidas */
        .btn-ejecutar-salida {
            width: 100%;
            padding: 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .btn-ejecutar-salida:hover {
            background-color: #c0392b;
        }

        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            min-height: 22px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consola de Ubicaciones</h2>
    <p class="sub">Control de posiciones rápido para el Mapa</p>

    <label for="operador">Nombre del Operador</label>
    <input type="text" id="operador" class="operador-input no-caps" placeholder="Ej: Juan Pérez" required autocomplete="on">

    <div class="tabs-contenedor">
        <button class="tab-boton active" onclick="cambiarPestana(event, 'tab-ingreso')">📥 Ingreso</button>
        <button class="tab-boton" onclick="cambiarPestana(event, 'tab-salida')">🛑 Salida</button>
        <button class="tab-boton" onclick="cambiarPestana(event, 'tab-movimiento')">🔄 Movimiento</button>
    </div>

    <div id="tab-ingreso" class="tab-contenido active">
        <label for="ingresoVehiculo">Vehículo a Ingresar (Placa Nueva)</label>
        <input type="text" id="ingresoVehiculo" placeholder="Ej: DJS023" maxlength="6">

        <label for="ingresoRef">Vehículo de Referencia (Placa del Mapa)</label>
        <input type="text" id="ingresoRef" placeholder="Ej: INV523" maxlength="6">

        <div class="guia-contenedor">
            <div class="guia-titulo">📍 Ubicar con respecto a la Referencia</div>
            <div class="mapa-botones">
                <div class="celda-vacia"></div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('ingreso', 'enfrente')">Enfrente</button>
                <div class="celda-vacia"></div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('ingreso', 'izquierda')">Izquierda</button>
                <div class="celda-referencia">REF.</div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('ingreso', 'derecha')">Derecha</button>
                <div class="celda-vacia"></div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('ingreso', 'atras')">Atrás</button>
                <div class="celda-vacia"></div>
            </div>
        </div>
    </div>

    <div id="tab-salida" class="tab-contenido">
        <label for="salidaVehiculo">Vehículo que se va del Patio (Placa)</label>
        <input type="text" id="salidaVehiculo" placeholder="Ej: DJS023" maxlength="6">
        
        <button type="button" class="btn-ejecutar-salida" onclick="procesarOperacion('salida', 'salida')">
            🛑 Confirmar Salida del Vehículo
        </button>
    </div>

    <div id="tab-movimiento" class="tab-contenido">
        <label for="movimientoVehiculo">Vehículo a Mover (Placa Interna)</label>
        <input type="text" id="movimientoVehiculo" placeholder="Ej: DJS023" maxlength="6">

        <label for="movimientoRef">Vehículo de Nueva Referencia</label>
        <input type="text" id="movimientoRef" placeholder="Ej: INV523" maxlength="6">

        <div class="guia-contenedor">
            <div class="guia-titulo">📍 Selecciona la Nueva Posición</div>
            <div class="mapa-botones">
                <div class="celda-vacia"></div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('movimiento', 'enfrente')">Enfrente</button>
                <div class="celda-vacia"></div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('movimiento', 'izquierda')">Izquierda</button>
                <div class="celda-referencia">REF.</div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('movimiento', 'derecha')">Derecha</button>
                <div class="celda-vacia"></div>
                <button type="button" class="btn-direccion" onclick="procesarOperacion('movimiento', 'atras')">Atrás</button>
                <div class="celda-vacia"></div>
            </div>
        </div>
    </div>
    
    <div id="mensaje"></div>
</div>

<script>
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyvXzfiL91AzhipQpdocPihooWIW4kgXxxQ31UEgJaBwiqzVLtuMjH1-TSNskmBg-oBnQ/exec";

    // Función para alternar el diseño visual entre pestañas
    function cambiarPestana(evt, nombrePestana) {
        const contenidos = document.getElementsByClassName("tab-contenido");
        for (let i = 0; i < contenidos.length; i++) {
            contenidos[i].classList.remove("active");
        }
        const botones = document.getElementsByClassName("tab-boton");
        for (let i = 0; i < botones.length; i++) {
            botones[i].classList.remove("active");
        }
        document.getElementById(nombrePestana).classList.add("active");
        evt.currentTarget.classList.add("active");
        
        // Limpia mensajes anteriores al cambiar de operación
        document.getElementById('mensaje').innerText = '';
    }

    // Procesador Inteligente Unificado
    function procesarOperacion(tipo, direccion) {
        const mensajeDiv = document.getElementById('mensaje');
        const operador = document.getElementById('operador').value.trim();
        
        let vTarget = "";
        let vRef = "";
        let comandoFinal = "";

        // Validar que el operador siempre exista
        if (!operador) {
            mensajeDiv.style.color = '#e67e22';
            mensajeDiv.innerText = '⚠️ Por favor, ingresa el Nombre del Operador.';
            return;
        }

        // Extraer datos dependiendo de la pestaña activa en la que se hizo clic
        if (tipo === 'ingreso') {
            vTarget = document.getElementById('ingresoVehiculo').value.trim().toUpperCase();
            vRef = document.getElementById('ingresoRef').value.trim().toUpperCase();
            if (!vTarget || !vRef) {
                mensajeDiv.style.color = '#e67e22';
                mensajeDiv.innerText = '⚠️ Requiere Placa de Ingreso y Referencia.';
                return;
            }
            comandoFinal = `${vTarget} ${direccion} ${vRef}`;

        } else if (tipo === 'salida') {
            vTarget = document.getElementById('salidaVehiculo').value.trim().toUpperCase();
            if (!vTarget) {
                mensajeDiv.style.color = '#e67e22';
                mensajeDiv.innerText = '⚠️ Por favor, ingresa la placa para la salida.';
                return;
            }
            comandoFinal = `${vTarget} salida`;

        } else if (tipo === 'movimiento') {
            vTarget = document.getElementById('movimientoVehiculo').value.trim().toUpperCase();
            vRef = document.getElementById('movimientoRef').value.trim().toUpperCase();
            if (!vTarget || !vRef) {
                mensajeDiv.style.color = '#e67e22';
                mensajeDiv.innerText = '⚠️ Requiere Placa a Mover y Nueva Referencia.';
                return;
            }
            comandoFinal = `${vTarget} ${direccion} ${vRef}`;
        }

        // Ejecutar envío
        mensajeDiv.style.color = '#34495e';
        mensajeDiv.innerText = 'Procesando en base de datos...';

        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            body: new URLSearchParams({ 
                'comando': comandoFinal,
                'operador': operador
            })
        })
        .then(response => response.text())
        .then(resultado => {
            if (resultado.includes("Éxito")) {
                mensajeDiv.style.color = '#27ae60';
                mensajeDiv.innerText = `¡Registrado con éxito! (${comandoFinal})`;
                
                // Limpiar únicamente los inputs de la pestaña usada
                if (tipo === 'ingreso') {
                    document.getElementById('ingresoVehiculo').value = '';
                    document.getElementById('ingresoRef').value = '';
                } else if (tipo === 'salida') {
                    document.getElementById('salidaVehiculo').value = '';
                } else if (tipo === 'movimiento') {
                    document.getElementById('movimientoVehiculo').value = '';
                    document.getElementById('movimientoRef').value = '';
                }
            } else {
                mensajeDiv.style.color = '#c0392b';
                mensajeDiv.innerText = '❌ ' + resultado; 
            }
        })
        .catch(error => {
            console.error('Error:', error);
            mensajeDiv.style.color = '#c0392b';
            mensajeDiv.innerText = 'Error crítico al conectar con el servidor.';
        });
    }
</script>

</body>
</html>
