<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizador de mapa morte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Actualizar Ubicación</h2>
    <form id="formularioUbicacion">
        <label for="vehiculo">Identificador del Vehículo</label>
        <input type="text" id="vehiculo" placeholder="Ej. Auto 01 o Placa" required>

        <label for="ubicacion">Nueva Ubicación (Coordenadas o Dirección)</label>
        <input type="text" id="ubicacion" placeholder="Ej. 4.6097, -74.0817" required>

        <button type="submit">Actualizar en Mapa</button>
    </form>
    <div id="mensaje"></div>
</div>

<script>

const URL_GOOGLE_SCRIPT = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI";

    document.getElementById('formularioUbicacion').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const mensajeDiv = document.getElementById('mensaje');
        mensajeDiv.style.color = 'black';
        mensajeDiv.innerText = 'Enviando actualización...';

        const datos = {
            vehiculo: document.getElementById('vehiculo').value,
            ubicacion: document.getElementById('ubicacion').value
        };

        // Enviamos los datos al puente de Google Sheets
        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors', // Evita problemas de CORS comunes en GitHub Pages
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mensajeDiv.style.color = 'green';
            mensajeDiv.innerText = '¡Ubicación actualizada con éxito!';
            document.getElementById('formularioUbicacion').reset();
        })
        .catch(error => {
            console.error('Error:', error);
            mensajeDiv.style.color = 'red';
            mensajeDiv.innerText = 'Error al conectar con el servidor.';
        });
    });
</script>

</body>
</html>
