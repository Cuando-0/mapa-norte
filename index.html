<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizador de Mapa por Comando</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 22px;
        }
        p.sub {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
            text-transform: uppercase; /* Fuerza visual de mayúsculas */
        }
        input[type="text"]::placeholder {
            text-transform: none; /* Mantiene el ejemplo en minúscula/normal */
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        .operador-input {
            border: 2px solid #34495e;
        }
        
        /* SECCIÓN DEL MAPA DE BOTONES INTERACTIVOS */
        .guia-contenedor {
            margin-top: 20px;
            border-top: 2px dashed #bdc3c7;
            padding-top: 20px;
        }
        .guia-titulo {
            font-size: 14px;
            color: #34495e;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .mapa-botones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 340px;
            margin: 0 auto 10px auto;
        }
        .celda-vacia {
            background-color: transparent;
        }
        .btn-direccion {
            background-color: #34495e;
            color: white;
            border: 1px solid #2c3e50;
            border-radius: 6px;
            padding: 15px 2px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-transform: uppercase;
        }
        .btn-direccion:hover {
            background-color: #2c3e50;
        }
        .btn-direccion:active {
            transform: scale(0.95);
        }
        .celda-referencia {
            background-color: #f1c40f;
            border: 1px solid #d4ac0d;
            border-radius: 6px;
            padding: 15px 2px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Botón de Salida Especial */
        .btn-salida {
            grid-column: span 3;
            background-color: #e74c3c;
            border: 1px solid #c0392b;
            margin-top: 5px;
        }
        .btn-salida:hover {
            background-color: #c0392b;
        }

        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            min-height: 22px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consola de Ubicaciones</h2>
    <p class="sub">Control de posiciones rápido para el Mapa</p>

    <form id="formularioComando" onsubmit="return false;">
        <label for="operador">Nombre del Operador</label>
        <input type="text" id="operador" class="operador-input" placeholder="Ej: Juan Pérez" required style="text-transform: none;">

        <label for="vehiculoIngresar">Vehículo a Ingresar (Placa Nueva)</label>
        <input type="text" id="vehiculoIngresar" placeholder="Ej: DJS023" maxlength="6" required>

        <label for="vehiculoRef">Vehículo de Referencia (Placa del Mapa)</label>
        <input type="text" id="vehiculoRef" placeholder="Ej: INV523" maxlength="6">
    </form>

    <div class="guia-contenedor">
        <div class="guia-titulo">📍 Selecciona el Movimiento</div>
        
        <div class="mapa-botones">
            <div class="celda-vacia"></div>
            <button type="button" class="btn-direccion" onclick="procesarMovimiento('enfrente')">Enfrente</button>
            <div class="celda-vacia"></div>
            
            <button type="button" class="btn-direccion" onclick="procesarMovimiento('izquierda')">Izquierda</button>
            <div class="celda-referencia">REF.</div>
            <button type="button" class="btn-direccion" onclick="procesarMovimiento('derecha')">Derecha</button>
            
            <div class="celda-vacia"></div>
            <button type="button" class="btn-direccion" onclick="procesarMovimiento('atras')">Atrás</button>
            <div class="celda-vacia"></div>

            <button type="button" class="btn-direccion btn-salida" onclick="procesarMovimiento('salida')">🛑 Registrar Salida del Vehículo</button>
        </div>
    </div>
    
    <div id="mensaje"></div>
</div>

<script>
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyvXzfiL91AzhipQpdocPihooWIW4kgXxxQ31UEgJaBwiqzVLtuMjH1-TSNskmBg-oBnQ/exec";

    function procesarMovimiento(direccion) {
        const mensajeDiv = document.getElementById('mensaje');
        const operador = document.getElementById('operador').value.trim();
        const vIngresar = document.getElementById('vehiculoIngresar').value.trim().toUpperCase();
        const vRef = document.getElementById('vehiculoRef').value.trim().toUpperCase();

        // Validar campos obligatorios básicos
        if (!operador) {
            mensajeDiv.style.color = '#e67e22';
            mensajeDiv.innerText = '⚠️ Por favor, ingresa el Nombre del Operador.';
            return;
        }
        if (!vIngresar) {
            mensajeDiv.style.color = '#e67e22';
            mensajeDiv.innerText = '⚠️ Por favor, ingresa la placa del Vehículo a Ingresar.';
            return;
        }

        let comandoFinal = "";

        // Construir comando según el botón presionado
        if (direccion === 'salida') {
            comandoFinal = `${vIngresar} salida`;
        } else {
            // Si es un movimiento, el vehículo de referencia es obligatorio
            if (!vRef) {
                mensajeDiv.style.color = '#e67e22';
                mensajeDiv.innerText = '⚠️ Para ubicar el auto necesitas colocar un Vehículo de Referencia.';
                return;
            }
            comandoFinal = `${vIngresar} ${direccion} ${vRef}`;
        }
        
        mensajeDiv.style.color = '#34495e';
        mensajeDiv.innerText = 'Procesando movimiento...';

        // Enviar la petición al Google Apps Script actual
        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            body: new URLSearchParams({ 
                'comando': comandoFinal,
                'operador': operador
            })
        })
        .then(response => response.text())
        .then(resultado => {
            if (resultado.includes("Éxito")) {
                mensajeDiv.style.color = '#27ae60';
                mensajeDiv.innerText = `¡Ubicación guardada con éxito! (${comandoFinal})`;
                
                // Limpiar celdas de vehículos para el próximo registro
                document.getElementById('vehiculoIngresar').value = '';
                document.getElementById('vehiculoRef').value = '';
            } else {
                mensajeDiv.style.color = '#c0392b';
                mensajeDiv.innerText = '❌ ' + resultado; 
            }
        })
        .catch(error => {
            console.error('Error:', error);
            mensajeDiv.style.color = '#c0392b';
            mensajeDiv.innerText = 'Error crítico al conectar con el servidor.';
        });
    }
</script>

</body>
</html>
