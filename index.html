<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizador de Mapa por Comando</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 22px;
        }
        p.sub {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 15px;
        }
        
        /* --- NUEVA SECCIÓN DE GUÍA VISUAL --- */
        .guia-contenedor {
            margin-top: 30px;
            border-top: 2px dashed #bdc3c7;
            padding-top: 20px;
        }
        .guia-titulo {
            font-size: 15px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Simulación de la cuadrícula de Excel */
        .mapa-ejemplo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 300px;
            margin: 0 auto 15px auto;
        }
        .celda {
            background-color: #dcdde1;
            border: 1px solid #7f8c8d;
            border-radius: 4px;
            padding: 10px 5px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        .celda.referencia {
            background-color: #f1c40f; /* Amarillo como tu mapa */
            color: #000;
        }
