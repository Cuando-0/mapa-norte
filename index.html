<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizador de Mapa por Comando</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 22px;
        }
        p.sub {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consola de Ubicaciones</h2>
    <p class="sub">
        Escribe la placa seguido de la instrucción de su posición:<br>
        <strong>enfrente de | atras de | a la derecha de | a la izquierda de</strong>
    </p>
    
    <form id="formularioComando">
        <label for="comando">Ingresa el Comando de Posición</label>
        <input type="text" id="comando" placeholder="Ej: HDL211 enfrente de DTM916" required autocomplete="off">

        <button type="submit">Actualizar Posición</button>
    </form>
    <div id="mensaje"></div>
</div>

<script>
    // URL de tu Google Apps Script actualizado
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyvXzfiL91AzhipQpdocPihooWIW4kgXxxQ31UEgJaBwiqzVLtuMjH1-TSNskmBg-oBnQ/exec"

    document.getElementById('formularioComando').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const mensajeDiv = document.getElementById('mensaje');
        const campoComando = document.getElementById('comando');
        
        mensajeDiv.style.color = '#34495e';
        mensajeDiv.innerText = 'Procesando comando...';

        const datos = {
            comando: campoComando.value
        };

        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mensajeDiv.style.color = '#27ae60';
            mensajeDiv.innerText = '¡Comando ejecutado y guardado con éxito!';
            campoComando.value = ''; 
        })
        .catch(error => {
            console.error('Error:', error);
            mensajeDiv.style.color = '#c0392b';
            mensajeDiv.innerText = 'Error al enviar el comando.';
        });
    });
</script>

</body>
</html>
